<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <title>Test de flux iCalendar</title>
    <style>
      body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; color: #0f172a; }
      input { width: 100%; padding: 0.7rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem; box-sizing: border-box; }
      button { margin-top: 0.8rem; padding: 0.7rem 1.2rem; border: none; border-radius: 8px; background: #2563eb; color: white; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: 0.6; }
      #verdict { margin: 1.2rem 0 0.5rem; font-weight: 700; }
      pre { background: #f1f5f9; padding: 1rem; border-radius: 8px; white-space: pre-wrap; word-break: break-word; font-size: 0.82rem; }
    </style>
  </head>
  <body>
    <h1>Test de lecture d'un flux iCalendar</h1>
    <p>Page temporaire de vérification. Collez l'adresse du flux : le champ est masqué et l'adresse n'est jamais affichée ni enregistrée.</p>
    <form id="form">
      <input id="url" type="password" autocomplete="off" placeholder="https://..." required />
      <button id="btn" type="submit">Tester</button>
    </form>
    <div id="verdict"></div>
    <pre id="out" hidden></pre>
    <script>
      const form = document.getElementById('form')
      const input = document.getElementById('url')
      const btn = document.getElementById('btn')
      const verdict = document.getElementById('verdict')
      const out = document.getElementById('out')

      form.addEventListener('submit', async (e) => {
        e.preventDefault()
        btn.disabled = true
        verdict.textContent = 'Lecture en cours...'
        out.hidden = true
        try {
          const res = await fetch('/api/ics-test', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ url: input.value.trim() }),
          })
          const data = await res.json()
          verdict.textContent = data.ok
            ? 'Le flux est lisible : ' + data.eventCount + ' événement(s) trouvé(s).'
            : 'Échec : ' + data.reason
          out.textContent = JSON.stringify(data, null, 2)
          out.hidden = false
        } catch (err) {
          verdict.textContent = 'Échec : le programme ne répond pas.'
        }
        btn.disabled = false
      })
    </script>
  </body>
</html>
